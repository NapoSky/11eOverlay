[package]
name = "overlay-11e"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "11eOverlay"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri                        = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener          = "2"
serde                        = { version = "1", features = ["derive"] }
serde_json                   = "1"

# HTTP + async runtime
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio   = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "net", "io-util"] }
futures-util = "0.3"

# OAuth loopback + URL handling
tiny_http = "0.12"
url       = "2"
rand      = "0.8"

# SSE
eventsource-client = "0.13"

# Crypto (token-at-rest)
aes-gcm    = "0.10"
hkdf       = "0.12"
sha2       = "0.10"
base64     = "0.22"
zeroize    = { version = "1", features = ["zeroize_derive"] }
machine-uid = "0.5"
hostname   = "0.4"

[profile.release]
panic   = "abort"
codegen-units = 1
lto     = true
opt-level = "s"     # optimize for size
strip   = true
